<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>open_system</title>
    <script type="application/javascript" src="javascript/gl-matrix-min.js"></script>
    <script type="module" src="javascript/f_dot.js"></script>
  </head>
  <style>
    #controls {
      display: flex;
      overflow-x: auto;
    }
    div.display_text {
      overflow-y: auto;
      border-left: solid 1px blue;
      padding-left: 4px;
    }
    button {
      background: transparent;
      border: none;
      border-left: 1px dotted purple;
      font-weight: bolder;
      margin: 4px 17px;
    }
    button pre {
      pointer-events: none;
    }

    canvas {
      position: absolute;
      z-index: 9;
      right: 0;
      top: 0;
    }
  </style>
  <body>
    <canvas id="gl-canvas" width="640" height="480"></canvas>
    <pre id="display"></pre>
    <div id="console"></div>
    <div id="controls"></div>
  </body>
  <script>
  var ws
  var connectDelay = 4444
  var autoReconnect = true;
  var connectTimer = null
  var counter = 0
  var lastMessageWasTimeout = false

  function sendControl(event) {
    ws.send(JSON.stringify({"uuid": event.target.getAttribute("id")})+"\n");
  }

  function escapeHtml(unsafe) {
    return String(unsafe ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function processMessage(wsEvent) {
    // rely on json parser exception
    try {
      // if pars-able, it is implicitly controls
      var parsed = JSON.parse(wsEvent.data)
      var controlsHtml = ""
      for(i = 0; i < parsed.length; i++) {
        controlsHtml = controlsHtml + `<button id="${parsed[i].uuid}" onclick="sendControl(event)"><pre>${escapeHtml(parsed[i].name)}</pre></button>`
      }
      document.getElementById('controls').innerHTML = controlsHtml
    } catch (error) {
      // otherwise assume display
      var node = document.createElement("div");
      node.className = "display_text"
      node.textContent = wsEvent.data
      document.getElementById('display').appendChild(node);
      setTimeout(function() {
        document.getElementById('controls').scrollIntoView({
          block: "end"
        });
      }, 44);
    }
  }

  function connect() {
    console.log('attempting to connect', 'info')

    lastMessageWasTimeout = false; // Reset timeout flag for new connection

    ws = new WebSocket(
      location.protocol === 'https:'
        ? 'wss://' + window.location.host + "/render"
        : 'ws://' + window.location.host + "/render"
    );

    ws.onopen = function (ev) {
      console.log('onopen', ev);

      // Reset timeout flag on new connection
      lastMessageWasTimeout = false;

      ws.onclose = function (ev) {
        console.log('onclose', ev);
        console.log('code:', ev.code);
        console.log('reason:', ev.reason);
        console.log('clean:', ev.wasClean);

        clearTimeout(connectTimer);

        // Check if server closed connection due to timeout
        // Note: Some browsers may not properly receive the close reason
        var isTimeoutClose = false;

        // Check multiple conditions for timeout detection
        if (ev.reason && ev.reason.includes('Connection timeout')) {
          isTimeoutClose = true;
        } else if (ev.code === 1000 && ev.wasClean && lastMessageWasTimeout) {
          // Fallback: if we received a timeout message just before close
          isTimeoutClose = true;
        }

        if (isTimeoutClose || lastMessageWasTimeout) {
          // Server explicitly closed due to timeout - don't reconnect

          if (!lastMessageWasTimeout) {
            // Only log if we didn't already log in onmessage
            var timeoutReason = ev.reason || 'Connection closed by server due to timeout';
            console.log('SERVER TIMEOUT: ' + timeoutReason, 'error');
            console.log('Connection terminated by server - no auto-reconnect', 'error');
          }
          console.log('To reconnect, click the Connect button', 'info');

          // Reset the flag for next connection
          lastMessageWasTimeout = false;
        } else if (autoReconnect) {
          console.log('disconnected, reconnecting in ' + (connectDelay / 1000) + ' seconds', 'info');
          connectTimer = setTimeout(connect, connectDelay);
        } else {
          console.log('disconnected', 'info');
        }
      } // ws.onclose
      ws.onerror = function (ev) {
        console.log('onerror', ev);
      } // ws.onerror
    }; // ws.onopen
    ws.onmessage = function (ev) {
      console.log('onmessage', ev);

      // Check if this is a timeout message
      if (ev.data && ev.data.includes && ev.data.includes('Connection timeout')) {
        lastMessageWasTimeout = true;
        autoReconnect = false; // Disable auto-reconnect immediately

        // Log the timeout message prominently
        console.log('SERVER TIMEOUT: ' + ev.data, 'error');
        console.log('Connection will close - no auto-reconnect', 'error');
        return; // Don't log as regular message
      }

      console.log(ev.data, 'recv');
      processMessage(ev);
    } // ws.onmessage
    ws.onerror = function (ev) {
      console.log('onerror', ev);
      clearTimeout(connectTimer);

      if (autoReconnect) {
        lconsole.og('unable to connect, retrying in ' + (connectDelay / 1000) + ' seconds', 'error');
        connectTimer = setTimeout(connect, connectDelay);
      } else {
        console.log('disconnected', 'info');
      }
    } // ws.onerror
  }

  connect();
  </script>
</html>
